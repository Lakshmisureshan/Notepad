<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #ffffff; color: #333; display: flex; flex-direction: column; height: 100vh; }
        
        /* Menu Bar */
        .menu-bar { background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; padding: 2px 5px; font-size: 13px; user-select: none; }
        .menu-item { position: relative; padding: 4px 10px; cursor: pointer; }
        .menu-item:hover { background: #e0e0e0; }
        .dropdown { display: none; position: absolute; top: 100%; left: 0; background: #ffffff; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.15); z-index: 1000; min-width: 150px; }
        .dropdown div { padding: 6px 12px; cursor: pointer; font-size: 13px; }
        .dropdown div:hover { background: #0078d4; color: white; }
        .menu-item.active .dropdown { display: block; }

        /* Find Bar */
        .find-bar { display: none; background: #f9f9f9; border-bottom: 1px solid #ccc; padding: 6px 10px; align-items: center; gap: 6px; font-size: 13px; }
        .find-bar input { padding: 3px 6px; border: 1px solid #ccc; font-size: 13px; }

        /* Container & Textarea */
        .container { flex: 1; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; max-width: 100%; width: 100%; }
        textarea { flex: 1; font-family: monospace; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 0; box-sizing: border-box; resize: none; width: 100%; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
        textarea.word-wrap { white-space: pre-wrap; overflow-wrap: break-word; overflow-x: hidden; }

        /* Bottom Button Bar */
        .button-bar { display: flex; justify-content: flex-end; align-items: center; margin-top: 8px; }
        button { background-color: #f0f0f0; color: #333; border: 1px solid #ccc; padding: 6px 12px; font-size: 14px; cursor: pointer; border-radius: 0; margin-left: 4px; }
        button:hover { background-color: #e0e0e0; }
        #status { margin-right: auto; color: #666; font-size: 13px; font-weight: normal; }
    </style>
</head>
<body>

<!-- Menu Bar -->
<div class="menu-bar">
    <div class="menu-item" onclick="toggleMenu(event, this)">
        Edit
        <div class="dropdown">
            <div onclick="undoText()">Undo</div>
            <div onclick="selectAllText()">Select All</div>
            <div onclick="openFind()">Find...</div>
        </div>
    </div>
    <div class="menu-item" onclick="toggleMenu(event, this)">
        View
        <div class="dropdown">
            <div onclick="toggleWordWrap()">Word Wrap: <span id="wrapStatus">Off</span></div>
        </div>
    </div>
</div>

<!-- Find Bar -->
<div id="findBar" class="find-bar">
    <span>Find:</span>
    <input type="text" id="findInput" placeholder="Find text...">
    <button onclick="findNext()" style="padding: 2px 8px; font-size: 12px; margin: 0;">Find Next</button>
    <button onclick="closeFind()" style="padding: 2px 6px; font-size: 12px; margin: 0;">✕</button>
</div>

<div class="container">
    <textarea id="codeContent" placeholder="Type here..."></textarea>
    <div class="button-bar">
        <span id="status"></span>
        <button onclick="loadFromCloud()">Load Data</button>
        <button onclick="copyText()">Copy Text</button>
        <button onclick="saveToCloud()">Save to Cloud</button>
    </div>
</div>

<script>
    const BIN_ID = '6a6658d5da38895dfe930056';
    const API_KEY = '$2a$10$FPgzNfQhAfoRmUOmmhDxMurkQkOcOd2suMzx/XagiT3welevDT2NS';

    // Menu logic
    function toggleMenu(event, element) {
        event.stopPropagation();
        document.querySelectorAll('.menu-item').forEach(item => {
            if (item !== element) item.classList.remove('active');
        });
        element.classList.toggle('active');
    }

    window.onclick = function() {
        document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
    };

    // Edit actions
    function undoText() {
        document.execCommand('undo');
    }

    function selectAllText() {
        document.getElementById('codeContent').select();
    }

    // Find actions
    function openFind() {
        document.getElementById('findBar').style.display = 'flex';
        document.getElementById('findInput').focus();
    }

    function closeFind() {
        document.getElementById('findBar').style.display = 'none';
    }

    function findNext() {
        const query = document.getElementById('findInput').value;
        const textarea = document.getElementById('codeContent');
        const text = textarea.value;
        const startIndex = textarea.selectionEnd;
        
        if (!query) return;

        const index = text.indexOf(query, startIndex);
        if (index !== -1) {
            textarea.setSelectionRange(index, index + query.length);
            textarea.focus();
        } else {
            const wrapIndex = text.indexOf(query);
            if (wrapIndex !== -1) {
                textarea.setSelectionRange(wrapIndex, wrapIndex + query.length);
                textarea.focus();
            } else {
                alert('Cannot find "' + query + '"');
            }
        }
    }

    // View actions (Word Wrap)
    function toggleWordWrap() {
        const textarea = document.getElementById('codeContent');
        const statusSpan = document.getElementById('wrapStatus');
        textarea.classList.toggle('word-wrap');
        if (textarea.classList.contains('word-wrap')) {
            statusSpan.innerText = 'On';
        } else {
            statusSpan.innerText = 'Off';
        }
    }

    function loadFromCloud() {
        document.getElementById('status').innerText = "Loading...";
        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('codeContent').value = data.record.text || '';
            document.getElementById('status').innerText = "Loaded from Cloud!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        })
        .catch(error => {
            document.getElementById('status').innerText = "Error loading!";
            console.error('Error loading data:', error);
        });
    }

    function copyText() {
        const textarea = document.getElementById('codeContent');
        textarea.select();
        document.execCommand('copy');
        document.getElementById('status').innerText = "Copied to clipboard!";
        setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
    }

    function saveToCloud() {
        const newText = document.getElementById('codeContent').value;
        document.getElementById('status').innerText = "Saving...";

        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        })
        .then(response => response.json())
        .then(data => {
            const existingText = data.record.text || '';
            const separator = "\n\n----------------------------------------\n\n";
            const combinedText = existingText ? existingText + separator + newText : newText;

            return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ text: combinedText })
            });
        })
        .then(response => response.json())
        .then(data => {
            // Clear notepad after successful save
            document.getElementById('codeContent').value = '';
            document.getElementById('status').innerText = "Saved to Cloud & Cleared!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        })
        .catch(error => {
            document.getElementById('status').innerText = "Error saving!";
            console.error('Error:', error);
        });
    }
</script>

</body>
</html>
