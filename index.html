<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #ffffff; color: #333; }
        .container { max-width: 800px; margin: auto; background: #ffffff; padding: 10px; }
        textarea { width: 100%; height: 400px; font-family: monospace; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 0; box-sizing: border-box; resize: vertical; }
        button { background-color: #f0f0f0; color: #333; border: 1px solid #ccc; padding: 6px 12px; font-size: 14px; cursor: pointer; border-radius: 0; margin-top: 8px; margin-right: 4px; }
        button:hover { background-color: #e0e0e0; }
        #status { margin-left: 10px; color: #666; font-size: 13px; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <textarea id="codeContent" placeholder="Type here..."></textarea>
    <br>
    <button onclick="copyText()">Copy Text</button>
    <button onclick="saveToCloud()">Save to Cloud</button>
    <span id="status"></span>
</div>

<script>
    const BIN_ID = '6a6658d5da38895dfe930056';
    const API_KEY = '$2a$10$FPgzNfQhAfoRmUOmmhDxMurkQkOcOd2suMzx/XagiT3welevDT2NS';

    window.onload = function() {
        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('codeContent').value = data.record.text || '';
        })
        .catch(error => console.error('Error loading data:', error));
    };

    function copyText() {
        const textarea = document.getElementById('codeContent');
        textarea.select();
        document.execCommand('copy');
        document.getElementById('status').innerText = "Copied to clipboard!";
        setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
    }

    function saveToCloud() {
        const textValue = document.getElementById('codeContent').value;
        document.getElementById('status').innerText = "Saving...";

        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': API_KEY
            },
            body: JSON.stringify({ text: textValue })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('status').innerText = "Saved to Cloud!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        })
        .catch(error => {
            document.getElementById('status').innerText = "Error saving!";
            console.error('Error:', error);
        });
    }
</script>

</body>
</html>
