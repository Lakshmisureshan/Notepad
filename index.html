<!DOCTYPE html>  
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE CRANES SYSTEM LLC - Launching Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        #landingPage {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .domain-header {
            padding: 30px 20px 20px 20px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            background: transparent;
            text-align: center;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 55vh;
            min-height: 350px;
            background: url('https://img1.wsimg.com/parking/images/backgrounds/bg-default.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-title-box {
            background-color: rgba(0, 85, 220, 0.85);
            padding: 15px 40px;
        }

        .hero-title-box h1 {
            margin: 0;
            font-size: 2.8rem;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .lower-section {
            background-color: #000000;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 50px;
            position: relative;
            padding-bottom: 50px;
        }

        .lower-section h2 {
            font-family: Georgia, serif;
            font-size: 2rem;
            font-weight: normal;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .contact-divider {
            width: 40px;
            height: 1px;
            background-color: #444444;
            margin-bottom: 25px;
        }

        .contact-form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
            text-align: left;
        }

        .form-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            background-color: #000000;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 14px 16px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            border-radius: 0;
        }

        .form-control:focus {
            border-color: #ffffff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 140px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #cccccc;
            user-select: none;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: #ffffff;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .send-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 35px;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #dddddd;
        }

        .form-footer-note {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #777777;
            text-align: center;
            width: 100%;
        }

        #formStatus {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #4CAF50;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div id="landingPage">
    <div class="domain-header">ACE CRANES SYSTEM LLC</div>
    <div class="hero-section">
        <div class="hero-title-box">
            <h1>LAUNCHING SOON</h1>
        </div>
    </div>
   
    <div class="lower-section" id="lowerSection">
        <h2>Contact Us</h2>
        <div class="contact-divider"></div>
        
        <div class="contact-form-container" id="contactFormContainer">
            <h2 style="font-family: Georgia, serif; font-size: 2rem; font-weight: normal; margin: 0 0 10px 0; color: #ffffff; text-align: center; width: 100%;">Drop us a line!</h2>
            <div class="contact-divider" style="margin: 0 auto 25px auto;"></div>
           
            <div class="form-group">
                <input type="text" id="dummyName" class="form-control" placeholder="Name">
            </div>
            <div class="form-group">
                <input type="email" id="dummyEmail" class="form-control" placeholder="Email*">
            </div>
            <div class="form-group">
                <textarea id="msgContent" class="form-control" placeholder="Message"></textarea>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="emailListCheck">
                <label for="emailListCheck">Sign up for our email list for updates, promotions, and more.</label>
            </div>
            <div style="text-align: center; width: 100%;">
                <button class="send-btn" onclick="handleFormSubmit(event)">Send</button>
                <div id="formStatus"></div>
            </div>
            <div class="form-footer-note">
                This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.
            </div>
        </div>
    </div>
</div>

<script>
    function handleFormSubmit(event) {
        event.preventDefault();
        const msgVal = document.getElementById('msgContent').value;
        const statusEl = document.getElementById('formStatus');

        if (!msgVal.trim()) {
            statusEl.style.color = '#ff6b6b';
            statusEl.innerText = "Please enter a message.";
            return;
        }

        statusEl.style.color = '#4CAF50';
        statusEl.innerText = "Thank you! Your message has been received.";
        
        document.getElementById('dummyName').value = '';
        document.getElementById('dummyEmail').value = '';
        document.getElementById('msgContent').value = '';
        document.getElementById('emailListCheck').checked = false;

        setTimeout(() => { 
            statusEl.innerText = ""; 
        }, 4000);
    }
</script>

</body>
</html>
