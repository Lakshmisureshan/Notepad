<!DOCTYPE html>  
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        #landingPage {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .domain-header {
            padding: 30px 20px 20px 20px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            background: transparent;
            text-align: center;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 55vh;
            min-height: 350px;
            background: url('https://img1.wsimg.com/parking/images/backgrounds/bg-default.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-title-box {
            background-color: rgba(0, 85, 220, 0.85);
            padding: 15px 40px;
        }

        .hero-title-box h1 {
            margin: 0;
            font-size: 2.8rem;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .lower-section {
            background-color: #000000;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 40px;
            position: relative;
            padding-bottom: 50px;
        }

        .lower-section h2 {
            font-family: Georgia, serif;
            font-size: 2rem;
            font-weight: normal;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .contact-divider {
            width: 40px;
            height: 1px;
            background-color: #444444;
            margin-bottom: 25px;
        }

        /* Landing Page Action Buttons Container */
        .landing-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .landing-dark-btn {
            background-color: #1a1a1a;
            color: #cccccc;
            border: 1px solid #333333;
            padding: 10px 22px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .landing-dark-btn:hover {
            background-color: #262626;
            color: #ffffff;
            border-color: #555555;
        }

        .contact-form-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
            text-align: left;
        }

        .form-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            background-color: #000000;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 14px 16px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            border-radius: 0;
        }

        .form-control:focus {
            border-color: #ffffff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 140px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #cccccc;
            user-select: none;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: #ffffff;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .send-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 35px;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #dddddd;
        }

        .form-footer-note {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #777777;
            text-align: center;
            width: 100%;
        }

        #formStatus {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #4CAF50;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* --- Classic Windows Notepad Popup Window --- */
        #appPage {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 520px;
            background: #f0f0f0;
            color: #000000;
            text-align: left;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border: 1px solid #7f9db9;
            flex-direction: column;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        /* Win98 / WinXP Style Window Title Bar */
        .notepad-titlebar {
            background: linear-gradient(to right, #0055ea, #337efd);
            color: #ffffff;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            user-select: none;
            cursor: default;
        }

        .notepad-title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notepad-title-buttons {
            display: flex;
            gap: 3px;
        }

        .win-btn {
            background: #d4d0c8;
            color: #000000;
            border: 1px solid #ffffff;
            border-right-color: #404040;
            border-bottom-color: #404040;
            width: 18px;
            height: 18px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .win-btn:active {
            border: 1px solid #404040;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
        }

        .notepad-menu-bar {
            background: #f0f0f0;
            border-bottom: 1px solid #dfdfdf;
            display: flex;
            align-items: center;
            padding: 2px 4px;
            font-size: 12px;
            user-select: none;
        }

        .menu-item {
            padding: 3px 8px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #316ac5;
            color: #ffffff;
        }

        .notepad-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 0; 
            margin: 0; 
            box-sizing: border-box; 
            width: 100%; 
        }

        textarea.editor-box { 
            flex: 1; 
            font-family: Consolas, "Courier New", monospace; 
            padding: 4px; 
            font-size: 13px; 
            border: none; 
            border-radius: 0; 
            box-sizing: border-box; 
            resize: none; 
            width: 100%; 
            outline: none; 
            background: #ffffff;
            color: #000000;
            line-height: 1.3;
        }

        .notepad-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 8px;
            background: #f0f0f0;
            border-top: 1px solid #dfdfdf;
            font-size: 11px;
            color: #444444;
            user-select: none;
        }

        .status-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Hidden/Preserved functional tools */
        .left-dots-cluster, .right-dots-cluster {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        button.tool-btn, label.tool-btn {
            background: transparent;
            color: transparent;
            border: none;
            outline: none;
            padding: 0;
            font-size: 0px;    
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4px;
            height: 4px;
        }

        #status { color: #0055ea; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
        .back-home-link { cursor: pointer; }
    </style>
</head>
<body>

<div id="landingPage">
    <div class="domain-header">ACE CRANES SYSTEM LLC</div>
    <div class="hero-section">
        <div class="hero-title-box">
            <h1>LAUNCHING SOON</h1>
        </div>
    </div>
   
    <div class="lower-section" id="lowerSection">
        <h2>Contact Us</h2>
        <div class="contact-divider"></div>

        <!-- 2 Dark Buttons in Landing Page -->
        <div class="landing-actions">
            <button class="landing-dark-btn" onclick="toggleContactForm()">Normal Operation</button>
            <button class="landing-dark-btn" onclick="openAppPage()">Notepad</button>
        </div>
    </div>

    <div class="contact-form-container" id="contactFormContainer">
        <h2 style="font-family: Georgia, serif; font-size: 2rem; font-weight: normal; margin: 0 0 10px 0; color: #ffffff; text-align: center; width: 100%;">Drop us a line!</h2>
        <div class="contact-divider" style="margin: 0 auto 25px auto;"></div>
       
        <div class="form-group">
            <input type="text" id="dummyName" class="form-control" placeholder="Name">
        </div>
        <div class="form-group">
            <input type="email" id="dummyEmail" class="form-control" placeholder="Email*">
        </div>
        <div class="form-group">
            <textarea id="msgContent" class="form-control" placeholder="Message"></textarea>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="emailListCheck">
            <label for="emailListCheck">Sign up for our email list for updates, promotions, and more.</label>
        </div>
        <div style="text-align: center; width: 100%;">
            <button class="send-btn" onclick="submitMessageToCloud()">Send</button>
            <div id="formStatus"></div>
        </div>
        <div class="form-footer-note">
            This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.
        </div>
    </div>
</div>

<!-- Popup Notepad Window -->
<div id="appPage">
    <div class="notepad-titlebar">
        <div class="notepad-title-left">
            <span>📄 Untitled - Notepad</span>
        </div>
        <div class="notepad-title-buttons">
            <button class="win-btn" onclick="openLandingPage()">✕</button>
        </div>
    </div>

    <div class="notepad-menu-bar">
        <span class="menu-item" onclick="ToCloud()">File</span>
        <span class="menu-item">Edit</span>
        <span class="menu-item">Format</span>
        <span class="menu-item" onclick="loadFromCloud()">View</span>
        <span class="menu-item">Help</span>
    </div>

    <div class="notepad-container">
        <textarea id="codeContent" class="editor-box" placeholder=""></textarea>
    </div>

    <div class="notepad-status-bar">
        <div style="display:none;">
            <input type="file" id="folderInput" webkitdirectory directory multiple onchange="uploadFolderToCloud(event)">
            <label for="folderInput" class="tool-btn"></label>
            <input type="file" id="zipInput" accept=".zip" onchange="uploadZipToCloud(event)">
            <label for="zipInput" class="tool-btn"></label>
            <input type="file" id="rarInput" accept=".rar" onchange="uploadRarToCloud(event)">
            <label for="rarInput" class="tool-btn"></label>
            <button class="tool-btn" onclick="loadFromCloud()"></button>
            <button class="tool-btn" onclick="ToCloud()"></button>
        </div>
        <span id="status"></span>
        <div class="status-group">
            <span>Ln 1, Col 1</span>
        </div>
    </div>
</div>

<script>
    const baseUrl = "https://aceinventory.net";
    const accountName = "mytextstorageapp";
    const sasToken = "sv=2026-02-06&ss=bfqt&srt=co&sp=rwdlacupiytfx&se=2027-01-21T02:20:14Z&st=2026-08-20T18:05:14Z&spr=https&sig=5WBgiYzE%2FyISNRRRjWHtaF5%2BKh6NUG9g7zw%2B5lIcTIQ%3D";
    const containerName = "notes-container";
    const azureVersion = "2020-10-02";

    function toggleContactForm() {
        const formContainer = document.getElementById('contactFormContainer');
        if (formContainer.style.display === 'flex') {
            formContainer.style.display = 'none';
        } else {
            formContainer.style.display = 'flex';
            formContainer.scrollIntoView({ behavior: 'smooth' });
        }
    }

    function openAppPage() {
        document.getElementById('appPage').style.display = 'flex';
    }

    function openLandingPage() {
        document.getElementById('appPage').style.display = 'none';
    }

    async function submitMessageToCloud() {
        const nameVal = document.getElementById('dummyName').value;
        const emailVal = document.getElementById('dummyEmail').value;
        const msgVal = document.getElementById('msgContent').value;
        const statusEl = document.getElementById('formStatus');

        if (!msgVal.trim()) {
            statusEl.style.color = '#ff6b6b';
            statusEl.innerText = "Please enter a message.";
            return;
        }

        statusEl.style.color = '#cccccc';
        statusEl.innerText = "Sending...";

        const newSubmission = `Name: ${nameVal}\nEmail: ${emailVal}\nMessage:\n${msgVal}`;
        const blobName = `message_${Date.now()}.txt`;
        const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
        const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

        try {
            const response = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "x-ms-version": azureVersion,
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: newSubmission
            });

            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorBody}`);
            }

            statusEl.style.color = '#4CAF50';
            statusEl.innerText = "Message sent successfully!";
            document.getElementById('dummyName').value = '';
            document.getElementById('dummyEmail').value = '';
            document.getElementById('msgContent').value = '';
            document.getElementById('emailListCheck').checked = false;
            setTimeout(() => { statusEl.innerText = ""; }, 3000);
        } catch (error) {
            statusEl.style.color = '#ff6b6b';
            statusEl.innerText = `[${error.name || 'Error'}] ${error.message}`;
        }
    }

    async function loadFromCloud() {
        document.getElementById('status').innerText = "Loading...";
        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const listUrl = `https://${accountName}.blob.core.windows.net/${containerName}?restype=container&comp=list&prefix=note_${cleanSas.replace('?', '&')}`;

            const listRes = await fetch(listUrl);
            if (!listRes.ok) {
                const errorBody = await listRes.text();
                throw new Error(`HTTP ${listRes.status}: ${errorBody}`);
            }
            const textData = await listRes.text();
           
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(textData, "text/xml");
            const blobs = xmlDoc.getElementsByTagName("Blob");

            if (blobs.length === 0) {
                document.getElementById('codeContent').value = "No files starting with 'note_' found.";
                document.getElementById('status').innerText = "Loaded!";
                setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
                return;
            }

            let validBlobs = [];
            for (let i = 0; i < blobs.length; i++) {
                const bNameNode = blobs[i].getElementsByTagName("Name")[0];
                if (bNameNode) {
                    validBlobs.push(bNameNode.textContent);
                }
            }

            if (validBlobs.length === 0) {
                document.getElementById('codeContent').value = "No matching files found.";
                document.getElementById('status').innerText = "Loaded!";
                setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
                return;
            }

            const latestBlobName = validBlobs[validBlobs.length - 1];
            const blobUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${latestBlobName}${cleanSas}`;

            const blobRes = await fetch(blobUrl);
            if (!blobRes.ok) {
                const errorBody = await blobRes.text();
                throw new Error(`HTTP ${blobRes.status}: ${errorBody}`);
            }
            const content = await blobRes.text();

            document.getElementById('codeContent').value = content;
            document.getElementById('status').innerText = "Loaded!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        } catch (error) {
            document.getElementById('status').innerText = `[${error.name || 'Error'}] ${error.message}`;
        }
    }

    async function ToCloud() {
        const newText = document.getElementById('codeContent').value;
        document.getElementById('status').innerText = "Saving...";

        try {
            const blobName = `note_${Date.now()}.txt`;
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

            const response = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "x-ms-version": azureVersion,
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: newText
            });

            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorBody}`);
            }

            document.getElementById('status').innerText = "Saved!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        } catch (error) {
            document.getElementById('status').innerText = `[${error.name || 'Error'}] ${error.message}`;
        }
    }
</script>

</body>
</html>
