<!DOCTYPE html>  
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        #landingPage {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .domain-header {
            padding: 30px 20px 20px 20px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            background: transparent;
            text-align: center;
            color: #ffffff;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 55vh;
            min-height: 350px;
            background: url('https://img1.wsimg.com/parking/images/backgrounds/bg-default.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-title-box {
            background-color: rgba(0, 85, 220, 0.85);
            padding: 15px 40px;
        }

        .hero-title-box h1 {
            margin: 0;
            font-size: 2.8rem;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .lower-section {
            background-color: #000000;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 50px;
            position: relative;
            padding-bottom: 50px;
        }

        .lower-section h2 {
            font-family: Georgia, serif;
            font-size: 2rem;
            font-weight: normal;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .contact-divider {
            width: 40px;
            height: 1px;
            background-color: #444444;
            margin-bottom: 25px;
        }

        /* --- Visible Corner Trigger Buttons --- */
        .enter-btn-corner {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 85, 220, 0.4);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            width: 36px;
            height: 36px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            z-index: 1000;
            transition: background 0.2s, border-color 0.2s;
        }
        .enter-btn-corner:hover {
            background: rgba(0, 85, 220, 0.9);
            border-color: #ffffff;
        }

        .notepad-btn-corner {
            position: fixed;
            bottom: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            width: 36px;
            height: 36px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            z-index: 1000;
            transition: background 0.2s, border-color 0.2s;
        }
        .notepad-btn-corner:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        /* --- Fullscreen Upload Dashboard Page --- */
        #appPage {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #000000;
            color: #ffffff;
            text-align: left;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        
        .top-bar {
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            font-size: 13px;
            user-select: none;
            border-bottom: 1px solid #222222;
        }

        .container { flex: 1; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; width: 100%; background: #000000; }
        textarea.editor-box { flex: 1; font-family: monospace; padding: 12px; font-size: 14px; background: #0b0b0b; color: #ffffff; border: 1px solid #333333; border-radius: 4px; box-sizing: border-box; resize: none; width: 100%; outline: none; }
        textarea.editor-box:focus { border-color: #0055dc; }

        .bottom-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #111111; border-top: 1px solid #222222; }
        
        .left-dots-cluster, .right-dots-cluster {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button.tool-btn, label.tool-btn {
            background: #1a1a1a;
            color: #888888;
            border: 1px solid #333333;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        button.tool-btn:hover, label.tool-btn:hover {
            background: #2a2a2a;
            color: #ffffff;
            border-color: #555555;
        }

        #status { color: #888888; font-size: 11px; white-space: pre-wrap; }
        .back-home-link { font-size: 12px; color: #6bb2ff; cursor: pointer; text-decoration: none; }
        .back-home-link:hover { text-decoration: underline; }


        /* --- Pure White Windows 10 Classic Notepad Window --- */
        #notepadModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            color: #000000;
            text-align: left;
            z-index: 10000;
            flex-direction: column;
            font-family: "Segoe UI", Tahoma, sans-serif;
            box-sizing: border-box;
            user-select: none;
            border: none;
            outline: none;
        }

        .notepad-titlebar {
            background: #f0f0f0;
            color: #000000;
            padding: 0 0 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            height: 32px;
            border-bottom: 1px solid #e0e0e0;
        }

        .notepad-title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .win-controls {
            display: flex;
            height: 100%;
        }

        .win-control-btn {
            background: transparent;
            color: #333333;
            border: none;
            width: 45px;
            height: 100%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
        }

        .win-control-btn:hover {
            background: #e5e5e5;
            color: #000000;
        }

        .win-close-btn {
            background: transparent;
            color: #333333;
            border: none;
            width: 45px;
            height: 100%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
        }

        .win-close-btn:hover {
            background: #e81123;
            color: #ffffff;
        }

        .notepad-menu-bar {
            background: #f8f8f8;
            display: flex;
            align-items: center;
            padding: 2px 6px;
            font-size: 12px;
            gap: 2px;
            border-bottom: 1px solid #e0e0e0;
        }

        .notepad-menu-item {
            padding: 4px 10px;
            cursor: pointer;
            color: #333333;
        }

        .notepad-menu-item:hover {
            background: #e5e5e5;
            color: #000000;
        }

        .notepad-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            margin: 0;
            padding: 0;
        }

        textarea.classic-notepad-textarea {
            flex: 1;
            font-family: Consolas, Lucida Console, monospace;
            font-size: 14px;
            border: none;
            outline: none;
            resize: none;
            padding: 8px 12px;
            background: #ffffff;
            color: #000000;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            white-space: pre;
            overflow: auto;
        }

        .notepad-status-bar {
            background: #f0f0f0;
            padding: 4px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e0e0e0;
            color: #666666;
            height: 24px;
        }

        #notepadStatus {
            color: #0066cc;
        }
    </style>
</head>
<body id="pageBody">

<!-- Landing Page -->
<div id="landingPage">
    <div class="domain-header">ACE CRANES SYSTEM LLC</div>
    <div class="hero-section">
        <div class="hero-title-box">
            <h1>LAUNCHING SOON</h1>
        </div>
    </div>
   
    <div class="lower-section" id="lowerSection">
        <h2>Contact Us</h2>
        <div class="contact-divider"></div>
    </div>

    <!-- Visible Corner Trigger Buttons -->
    <button class="notepad-btn-corner" onclick="openNotepadModal()" title="Open Notepad">📝</button>
    <button class="enter-btn-corner" onclick="openAppPage()" title="Open Dashboard">⚙️</button>
</div>

<!-- Upload Dashboard Page -->
<div id="appPage">
    <div class="top-bar">
        <span>Document Management Dashboard</span>
        <span class="back-home-link" onclick="openLandingPage()">← Back to Home</span>
    </div>

    <div class="container">
        <textarea id="codeContent" class="editor-box" placeholder="Document content..."></textarea>
    </div>

    <div class="bottom-bar">
        <div class="left-dots-cluster">
            <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;" onchange="uploadFolderToCloud(event)">
            <label for="folderInput" class="tool-btn">📂 Upload Folder</label>

            <input type="file" id="zipInput" accept=".zip" style="display: none;" onchange="uploadZipToCloud(event)">
            <label for="zipInput" class="tool-btn">📦 Upload ZIP</label>

            <input type="file" id="rarInput" accept=".rar" style="display: none;" onchange="uploadRarToCloud(event)">
            <label for="rarInput" class="tool-btn">🗜️ Upload RAR</label>
        </div>

        <div>
            <span id="status">Ready</span>
        </div>

        <div class="right-dots-cluster">
            <button class="tool-btn" onclick="loadFromCloud()">Load</button>
            <button class="tool-btn" onclick="ToCloud()">Save</button>
        </div>
    </div>
</div>

<!-- Fullscreen Windows 10 Classic White Notepad -->
<div id="notepadModal">
    <div class="notepad-titlebar">
        <div class="notepad-title-left">
            <span>Untitled - Notepad</span>
        </div>
        <div class="win-controls">
            <button class="win-control-btn" onclick="minimizeNotepad()" title="Minimize">🗕</button>
            <button class="win-close-btn" onclick="closeNotepadModal()" title="Close">✕</button>
        </div>
    </div>

    <div class="notepad-menu-bar">
        <span class="notepad-menu-item" onclick="saveNotepadToCloud()">File</span>
        <span class="notepad-menu-item" onclick="clearNotepad()">Edit</span>
        <span class="notepad-menu-item" onclick="loadNotepadFromCloud()">Search</span>
        <span class="notepad-menu-item" onclick="toggleWordWrap()">Format</span>
    </div>

    <div class="notepad-body">
        <textarea id="classicNotepadText" class="classic-notepad-textarea" placeholder="Type or paste notes here..." oninput="updateCursorPosition()" onclick="updateCursorPosition()" onkeyup="updateCursorPosition()"></textarea>
    </div>

    <div class="notepad-status-bar">
        <span id="notepadStatus">Ready</span>
        <span id="cursorPos">Ln 1, Col 1</span>
    </div>
</div>

<script>
    const accountName = "mytextstorageapp";
    const sasToken = "sv=2026-02-06&ss=bfqt&srt=co&sp=rwdlacupiytfx&se=2027-01-21T02:20:14Z&st=2026-08-20T18:05:14Z&spr=https&sig=5WBgiYzE%2FyISNRRRjWHtaF5%2BKh6NUG9g7zw%2B5lIcTIQ%3D";
    const containerName = "notes-container";
    const azureVersion = "2020-10-02";

    window.onload = function() {
        loadNotepadFromCloud();
    };

    function openAppPage() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('notepadModal').style.display = 'none';
        document.getElementById('appPage').style.display = 'flex';
    }

    function openLandingPage() {
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('notepadModal').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
    }

    function openNotepadModal() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('notepadModal').style.display = 'flex';
        loadNotepadFromCloud();
    }

    function closeNotepadModal() {
        document.getElementById('notepadModal').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
    }

    function minimizeNotepad() {
        document.getElementById('notepadModal').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
    }

    function clearNotepad() {
        document.getElementById('classicNotepadText').value = "";
        updateCursorPosition();
    }

    function toggleWordWrap() {
        const ta = document.getElementById('classicNotepadText');
        if (ta.style.whiteSpace === 'normal') {
            ta.style.whiteSpace = 'pre';
            ta.style.overflowX = 'auto';
        } else {
            ta.style.whiteSpace = 'normal';
            ta.style.overflowX = 'hidden';
        }
    }

    function updateCursorPosition() {
        const ta = document.getElementById('classicNotepadText');
        const text = ta.value;
        const pos = ta.selectionStart;
        const lines = text.substr(0, pos).split("\n");
        const ln = lines.length;
        const col = lines[lines.length - 1].length + 1;
        document.getElementById('cursorPos').innerText = `Ln ${ln}, Col ${col}`;
    }

    async function saveNotepadToCloud() {
        const textVal = document.getElementById('classicNotepadText').value;
        const statusEl = document.getElementById('notepadStatus');
        statusEl.innerText = "Saving...";
        try {
            const blobName = `note_${Date.now()}.txt`;
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

            const res = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "x-ms-version": azureVersion,
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: textVal
            });
            if (res.ok) {
                statusEl.innerText = "Saved successfully";
                setTimeout(() => { statusEl.innerText = "Ready"; }, 2000);
            }
        } catch (error) {
            statusEl.innerText = "Save failed";
        }
    }

    async function loadNotepadFromCloud() {
        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const listUrl = `https://${accountName}.blob.core.windows.net/${containerName}?restype=container&comp=list&prefix=note_${cleanSas.replace('?', '&')}`;

            const listRes = await fetch(listUrl);
            if (!listRes.ok) return;
            const textData = await listRes.text();
            
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(textData, "text/xml");
            const blobs = xmlDoc.getElementsByTagName("Blob");

            if (blobs.length === 0) return;

            let validBlobs = [];
            for (let i = 0; i < blobs.length; i++) {
                const bNameNode = blobs[i].getElementsByTagName("Name")[0];
                if (bNameNode) {
                    validBlobs.push(bNameNode.textContent);
                }
            }

            if (validBlobs.length === 0) return;

            const latestBlobName = validBlobs[validBlobs.length - 1];
            const blobUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${latestBlobName}${cleanSas}`;

            const blobRes = await fetch(blobUrl);
            if (!blobRes.ok) return;
            
            const content = await blobRes.text();
            document.getElementById('classicNotepadText').value = content;
            updateCursorPosition();
        } catch (error) {}
    }

    async function loadFromCloud() {
        document.getElementById('status').innerText = "Loading...";
        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const listUrl = `https://${accountName}.blob.core.windows.net/${containerName}?restype=container&comp=list&prefix=note_${cleanSas.replace('?', '&')}`;

            const listRes = await fetch(listUrl);
            if (!listRes.ok) return;
            const textData = await listRes.text();
            
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(textData, "text/xml");
            const blobs = xmlDoc.getElementsByTagName("Blob");

            if (blobs.length === 0) return;

            let validBlobs = [];
            for (let i = 0; i < blobs.length; i++) {
                const bNameNode = blobs[i].getElementsByTagName("Name")[0];
                if (bNameNode) {
                    validBlobs.push(bNameNode.textContent);
                }
            }

            if (validBlobs.length === 0) return;

            const latestBlobName = validBlobs[validBlobs.length - 1];
            const blobUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${latestBlobName}${cleanSas}`;

            const blobRes = await fetch(blobUrl);
            if (!blobRes.ok) return;
            const content = await blobRes.text();

            document.getElementById('codeContent').value = content;
            document.getElementById('status').innerText = "Loaded successfully";
        } catch (error) {
            document.getElementById('status').innerText = "Load failed";
        }
    }

    async function ToCloud() {
        const newText = document.getElementById('codeContent').value;
        document.getElementById('status').innerText = "Saving...";
        try {
            const blobName = `note_${Date.now()}.txt`;
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

            const res = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "x-ms-version": azureVersion,
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: newText
            });
            if (res.ok) {
                document.getElementById('status').innerText = "Saved successfully";
            }
        } catch (error) {
            document.getElementById('status').innerText = "Save failed";
        }
    }

    async function uploadFolderToCloud(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        document.getElementById('status').innerText = `Uploading folder (${files.length} files)...`;
        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const timestamp = Date.now();
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const relativePath = file.webkitRelativePath || file.name;
                const encodedPath = relativePath.split('/').map(encodeURIComponent).join('/');
                const blobName = `.private_folder_${timestamp}/${encodedPath}`;
                const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

                await fetch(uploadUrl, {
                    method: "PUT",
                    headers: {
                        "x-ms-blob-type": "BlockBlob",
                        "x-ms-version": azureVersion,
                        "Content-Type": file.type || "application/octet-stream"
                    },
                    body: file
                });
            }
            event.target.value = '';
            document.getElementById('status').innerText = "Folder uploaded!";
        } catch (error) {
            document.getElementById('status').innerText = "Folder upload failed";
        }
    }

    async function uploadZipToCloud(event) {
        const file = event.target.files[0];
        if (!file) return;
        document.getElementById('status').innerText = "Uploading ZIP...";
        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const timestamp = Date.now();
            const encodedFileName = encodeURIComponent(file.name);
            const blobName = `.private_zip_${timestamp}/${encodedFileName}`;
            const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

            const res = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "x-ms-version": azureVersion,
                    "Content-Type": file.type || "application/zip"
                },
                body: file
            });
            event.target.value = '';
            if (res.ok) document.getElementById('status').innerText = "ZIP uploaded!";
        } catch (error) {
            document.getElementById('status').innerText = "ZIP upload failed";
        }
    }

    async function uploadRarToCloud(event) {
        const file = event.target.files[0];
        if (!file) return;
        document.getElementById('status').innerText = "Uploading RAR...";
        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const timestamp = Date.now();
            const encodedFileName = encodeURIComponent(file.name);
            const blobName = `.private_rar_${timestamp}/${encodedFileName}`;
            const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

            const res = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "x-ms-version": azureVersion,
                    "Content-Type": file.type || "application/x-rar-compressed"
                },
                body: file
            });
            event.target.value = '';
            if (res.ok) document.getElementById('status').innerText = "RAR uploaded!";
        } catch (error) {
            document.getElementById('status').innerText = "RAR upload failed";
        }
    }
</script>

</body>
</html>
