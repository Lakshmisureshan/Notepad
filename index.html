<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEINVENTORY.NET</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        #landingPage {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .domain-header {
            padding: 30px 20px 20px 20px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            background: transparent;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 55vh;
            min-height: 350px;
            background: url('https://img1.wsimg.com/parking/images/backgrounds/bg-default.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-title-box {
            background-color: rgba(0, 85, 220, 0.85);
            padding: 15px 40px;
        }

        .hero-title-box h1 {
            margin: 0;
            font-size: 2.8rem;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .lower-section {
            background-color: #000000;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 50px;
            position: relative;
            padding-bottom: 50px;
        }

        .lower-section h2 {
            font-family: Georgia, serif;
            font-size: 2rem;
            font-weight: normal;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .contact-divider {
            width: 40px;
            height: 1px;
            background-color: #444444;
            margin-bottom: 25px;
        }

        .drop-link {
            color: #999999;
            font-size: 0.9rem;
            text-decoration: none;
        }

        /* Extreme bottom right corner button with pure black background and text "o" */
        .enter-btn-corner {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: #000000;
            color: #555555;
            border: 1px solid #1a1a1a;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-family: monospace;
            cursor: pointer;
            outline: none;
            border-radius: 4px;
            text-transform: lowercase;
            transition: all 0.2s;
            z-index: 1000;
        }
        .enter-btn-corner:hover {
            background: #111111;
            color: #aaaaaa;
            border-color: #333333;
        }

        /* App View (Initially Hidden) */
        #appPage {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #ffffff;
            color: #2b2b2b;
            text-align: left;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        
        .top-bar { background: #f0f0f0; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; padding: 2px 5px; font-size: 13px; user-select: none; }
        .menu-group { display: flex; align-items: center; }
        .menu-item { position: relative; padding: 4px 10px; cursor: pointer; }
        .menu-item:hover { background: #e0e0e0; }
        .dropdown { display: none; position: absolute; top: 100%; left: 0; background: #ffffff; border: 1px solid #e0e0e0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; min-width: 150px; }
        .dropdown div { padding: 6px 12px; cursor: pointer; font-size: 13px; color: #333; }
        .dropdown div:hover { background: #0078d4; color: white; }
        .menu-item.active .dropdown { display: block; }

        .find-bar { display: none; background: #f9f9f9; border-bottom: 1px solid #e0e0e0; padding: 6px 10px; align-items: center; gap: 6px; font-size: 13px; }
        .find-bar input { padding: 3px 6px; border: 1px solid #e0e0e0; font-size: 13px; outline: none; }

        .container { flex: 1; display: flex; flex-direction: column; padding: 10px 10px 2px 10px; box-sizing: border-box; max-width: 100%; width: 100%; }
        textarea { flex: 1; font-family: monospace; padding: 10px; font-size: 14px; border: 1px solid #e0e0e0; border-radius: 0; box-sizing: border-box; resize: none; width: 100%; white-space: pre; overflow-wrap: normal; overflow-x: auto; outline: none; }
        textarea:focus { border-color: #b0b0b0; }
        textarea.word-wrap { white-space: pre-wrap; overflow-wrap: break-word; overflow-x: hidden; }

        .bottom-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 6px 10px; background: #ffffff; }
        .action-buttons { display: flex; align-items: center; }
        button.tool-btn { background: #e8e8e8; color: #333; border: 1px solid #d0d0d0; outline: none; padding: 1px 3px; font-size: 10px; font-family: sans-serif; font-weight: bold; cursor: pointer; margin-left: 2px; line-height: 1; }
        button.tool-btn:hover { background: #dcdcdc; border-color: #adadad; }
        #status { color: #666; font-size: 10px; margin-right: 6px; }
        .back-home-link { font-size: 11px; color: #0078d4; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div id="landingPage">
    <div class="domain-header">ACEINVENTORY.NET</div>
    <div class="hero-section">
        <div class="hero-title-box">
            <h1>Launching Soon</h1>
        </div>
    </div>
    <div class="lower-section">
        <h2>Contact Us</h2>
        <div class="contact-divider"></div>
        <a href="#" class="drop-link">Drop us a line!</a>
    </div>

    <!-- Extreme bottom right corner button with pure black background and text "o" -->
    <button class="enter-btn-corner" onclick="openAppPage()" title="Open Editor">o</button>
</div>

<div id="appPage">
    <div class="top-bar">
        <div class="menu-group">
            <div class="menu-item" onclick="toggleMenu(event, this)">
                Edit
                <div class="dropdown">
                    <div onclick="undoText()">Undo</div>
                    <div onclick="selectAllText()">Select All</div>
                    <div onclick="openFind()">Find...</div>
                </div>
            </div>
            <div class="menu-item" onclick="toggleMenu(event, this)">
                View
                <div class="dropdown">
                    <div onclick="toggleWordWrap()">Word Wrap: <span id="wrapStatus">Off</span></div>
                </div>
            </div>
        </div>
        <div style="padding-right: 5px;">
            <span class="back-home-link" onclick="openLandingPage()">← Back to Home</span>
        </div>
    </div>

    <div id="findBar" class="find-bar">
        <span>Find:</span>
        <input type="text" id="findInput" placeholder="Find text...">
        <button onclick="findNext()" style="padding: 2px 8px; font-size: 12px; margin: 0; background: #f0f0f0; border: 1px solid #e0e0e0;">Find Next</button>
        <button onclick="closeFind()" style="padding: 2px 6px; font-size: 12px; margin: 0; background: #f0f0f0; border: 1px solid #e0e0e0;">✕</button>
    </div>

    <div class="container">
        <textarea id="codeContent" placeholder="Type here..."></textarea>
    </div>

    <div class="bottom-bar">
        <span class="back-home-link" onclick="openLandingPage()">← Home</span>
        <div class="action-buttons">
            <span id="status"></span>
            <button class="tool-btn" onclick="loadFromCloud()" title="Load Data">L</button>
            <button class="tool-btn" onclick="copyText()" title="Copy Text">C</button>
            <button class="tool-btn" onclick="saveToCloud()" title="Save to Cloud">S</button>
            <button class="tool-btn" onclick="eraseText()" title="Erase Pad">E</button>
        </div>
    </div>
</div>

<script>
    const BIN_ID = '6a6658d5da38895dfe930056';
    const API_KEY = '$2a$10$FPgzNfQhAfoRmUOmmhDxMurkQkOcOd2suMzx/XagiT3welevDT2NS';

    function openAppPage() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('appPage').style.display = 'flex';
    }

    function openLandingPage() {
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
    }

    function toggleMenu(event, element) {
        event.stopPropagation();
        document.querySelectorAll('.menu-item').forEach(item => {
            if (item !== element) item.classList.remove('active');
        });
        element.classList.toggle('active');
    }

    window.onclick = function() {
        document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
    };

    function undoText() {
        document.execCommand('undo');
    }

    function selectAllText() {
        document.getElementById('codeContent').select();
    }

    function openFind() {
        document.getElementById('findBar').style.display = 'flex';
        document.getElementById('findInput').focus();
    }

    function closeFind() {
        document.getElementById('findBar').style.display = 'none';
    }

    function findNext() {
        const query = document.getElementById('findInput').value;
        const textarea = document.getElementById('codeContent');
        const text = textarea.value;
        const startIndex = textarea.selectionEnd;
        
        if (!query) return;

        const index = text.indexOf(query, startIndex);
        if (index !== -1) {
            textarea.setSelectionRange(index, index + query.length);
            textarea.focus();
        } else {
            const wrapIndex = text.indexOf(query);
            if (wrapIndex !== -1) {
                textarea.setSelectionRange(wrapIndex, wrapIndex + query.length);
                textarea.focus();
            } else {
                alert('Cannot find "' + query + '"');
            }
        }
    }

    function toggleWordWrap() {
        const textarea = document.getElementById('codeContent');
        const statusSpan = document.getElementById('wrapStatus');
        textarea.classList.toggle('word-wrap');
        if (textarea.classList.contains('word-wrap')) {
            statusSpan.innerText = 'On';
        } else {
            statusSpan.innerText = 'Off';
        }
    }

    function loadFromCloud() {
        document.getElementById('status').innerText = "Loading...";
        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('codeContent').value = data.record.text || '';
            document.getElementById('status').innerText = "Loaded!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        })
        .catch(error => {
            document.getElementById('status').innerText = "Error!";
            console.error('Error loading data:', error);
        });
    }

    function copyText() {
        const textarea = document.getElementById('codeContent');
        textarea.select();
        document.execCommand('copy');
        document.getElementById('status').innerText = "Copied!";
        setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
    }

    function saveToCloud() {
        const newText = document.getElementById('codeContent').value;
        document.getElementById('status').innerText = "Saving...";

        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        })
        .then(response => response.json())
        .then(data => {
            const existingText = data.record.text || '';
            const separator = "\n\n----------------------------------------\n\n";
            const combinedText = existingText ? existingText + separator + newText : newText;

            return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ text: combinedText })
            });
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('status').innerText = "Saved!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        })
        .catch(error => {
            document.getElementById('status').innerText = "Error!";
            console.error('Error:', error);
        });
    }

    function eraseText() {
        document.getElementById('codeContent').value = '';
        document.getElementById('status').innerText = "Erased!";
        setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
    }
</script>

</body>
</html>
